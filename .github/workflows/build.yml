name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build plugins
        run: ./gradlew make --stacktrace

      - name: List generated files
        run: ls -l repo.json build/plugins/ || echo "Files missing"

      - name: Upload repo.json
        uses: actions/upload-artifact@v4
        with:
          name: repo-json
          path: repo.json

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: build/plugins/*.apk          name: repo-json
          path: repo.json

      # 6. Upload all plugin APKs
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: build/plugins/*.apk

      # 7. Also push repo.json to the master branch (optional, but convenient)
      - name: Push repo.json to master
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add repo.json
          git commit -m "Update repo.json [skip ci]" || echo "No changes to commit"
          git push
